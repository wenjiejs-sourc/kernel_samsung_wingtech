name: Build Samsung A04 SukiSU-Ultra

on:
  workflow_dispatch: # 手动触发构建

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装构建环境
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison g++-multilib gcc-multilib \
          binutils-aarch64-linux-gnu git gnupg gperf lib32ncurses5-dev lib32readline-dev \
          lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 \
          libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
          python3 python2

      - name: 获取工具链 (AOSP Clang)
        run: |
          mkdir clang
          cd clang
          wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r416183b1.tar.gz
          tar -xf clang-r416183b1.tar.gz

      - name: 获取内核源码
        run: |
          # 请替换为你找到的 A04 内核源码地址
          # 示例使用 generic a04 源码分支
          git clone --depth=1 https://github.com/mizuno-asuka/android_kernel_samsung_a04 kernel-src
          cd kernel-src

      - name: 集成 SukiSU-Ultra
        run: |
          cd kernel-src
          # 使用官方安装脚本集成 SukiSU-Ultra 内核部分
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main
          
          # 修改配置文件以启用 SukiSU (假设 defconfig 文件名为 a04_defconfig)
          # 注意：实际文件名需根据你的源码 arch/arm64/configs/ 确定
          DEFCONFIG="a04_defconfig" 
          echo "CONFIG_KSU=y" >> arch/arm64/configs/$DEFCONFIG
          echo "CONFIG_KSU_SUKI_ULTRA=y" >> arch/arm64/configs/$DEFCONFIG

      - name: 开始编译
        run: |
          cd kernel-src
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          # 替换为你实际的 defconfig 文件名
          make O=out a04_defconfig
          make -j$(nproc --all) O=out \
                      CC=clang \
                      CLANG_TRIPLE=aarch64-linux-gnu- \
                      CROSS_COMPILE=aarch64-linux-gnu- \
                      CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                      LD=ld.lld \
                      AR=llvm-ar \
                      NM=llvm-nm \
                      OBJCOPY=llvm-objcopy \
                      OBJDUMP=llvm-objdump \
                      STRIP=llvm-strip

      - name: 打包 AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3
          cp kernel-src/out/arch/arm64/boot/Image.gz AnyKernel3/
          cd AnyKernel3
          zip -r ../SukiSU-Ultra-A04-Kernel.zip *

      - name: 上传构建结果
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Kernel-A04
          path: SukiSU-Ultra-A04-Kernel.zip
